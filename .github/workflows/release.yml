name: Release

# **Publishing is deliberate and cannot happen by accident.** This runs only when a `v*` tag is
# pushed, or when somebody dispatches it by hand. A merge to `main` publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `write`, not `read`: the last step creates the GitHub release.
      contents: write
      # Required for npm provenance: npm exchanges this for a signed attestation linking the
      # published tarball to the commit and workflow that produced it. Without it, `provenance: true`
      # in package.json fails the publish rather than silently skipping.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The full gate runs again here, against the exact commit being published. CI passing on the
      # branch is not the same claim: a tag can point anywhere.
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      # `--provenance` is redundant with publishConfig and stated anyway, because the flag is what a
      # reader looks for and a silent default is how provenance quietly stops being generated.
      - run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # **A tag is not a release.** Every version so far was published to npm and left no trace on
      # GitHub: the workflow was named Release and only ever did half of one, so a reader browsing
      # the repository saw tags and no notes. The notes ARE the changelog section, extracted rather
      # than rewritten - two accounts of one release is one account too many, and the second drifts.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [$version]" 'index($0,v)==1{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md > /tmp/notes.md
          # Fails rather than publishing an empty release: a version with no changelog section is a
          # release nobody can read, and the tag is already pushed by the time anyone would notice.
          test -s /tmp/notes.md
          # Idempotent, because a publish that failed on auth is rerun against a tag that already exists.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
